name: quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec effect-tsgo patch --oxlint --no-typescript
      - run: pnpm exec biome check --error-on-warnings .
      - run: pnpm exec oxlint --config oxlint.config.ts .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/test-cli-process.mjs
      - run: git diff --check
