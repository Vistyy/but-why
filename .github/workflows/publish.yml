name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
      - name: Check release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) throw new Error("Tag must match package.json version")'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec effect-tsgo patch --oxlint --no-typescript
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/test-cli-process.mjs
      - run: git diff --check
      - run: pnpm pack --out release.tgz
      # npm is only the OIDC publication transport; pnpm owns installation and packing.
      - run: npm publish ./release.tgz --access public
