id: process-properties-belong-to-cli-entry
valid:
  - environment.cwd
  - processState.env
invalid:
  - process.env
  - process.stdout.write(output)
  - process.exitCode = 1
  - globalThis.process.env
---
id: effect-tests-use-effect-vitest-runtime
valid:
  - it.effect("executes work", () => Effect.map(work, done))
  - it.scoped("executes scoped work", () => work)
invalid:
  - Effect.runPromise(work)
  - Fx.runPromiseExit(work)
  - Effect.runSync(work)
  - runtime.runSyncExit(work)
  - Effect.runFork(work)
  - Fx.runCallback(work)
---
id: task-identity-branding-belongs-to-task-id
valid:
  - storedPublicTaskId(value)
  - value satisfies PublicTaskId
invalid:
  - value as PublicTaskId
  - value as TaskSlug
---
id: wall-clock-belongs-to-cli-entry
valid:
  - new Date(value)
  - clock.now()
invalid:
  - new Date()
  - Date.now()
  - new globalThis.Date()
  - globalThis.Date.now()
  - Date["now"]()
  - globalThis.Date["now"]()
---
id: json-parse-assertions-keep-unknown
# The serialization transform is prohibited outside the ignored file; the sole
# file-scoped exception is src/output/structuredValue.ts because its immediately
# preceding JSON serialization establishes exactly the StructuredValue representation.
valid:
  - JSON.parse(x) as unknown
  - "<unknown>JSON.parse(x)"
  - (JSON.parse(x)) as unknown
  - "<unknown>(JSON.parse(x))"
  - JSON.parse(x) as unknown as unknown
  - "<unknown><unknown>JSON.parse(x)"
  - "const value: unknown = JSON.parse(source);"
  - decode(value, path)
invalid:
  - JSON.parse(x) as TrustedType
  - "<TrustedType>JSON.parse(x)"
  - (JSON.parse(x)) as TrustedType
  - "<TrustedType>(JSON.parse(x))"
  - JSON.parse((x)) as TrustedType
  - "<TrustedType>(JSON.parse((x)))"
  - JSON.parse(x) as Record<string, unknown>
  - "JSON.parse(x) as { readonly id: string }"
  - JSON.parse(x) as DomainType[]
  - JSON.parse(x) as unknown[]
  - JSON.parse(x) as any
  - "<any>JSON.parse(x)"
  - JSON.parse(x) satisfies unknown
  - JSON.parse(x) satisfies TrustedType
  - JSON.parse(x)! satisfies TrustedType
  - (JSON.parse(x) as unknown)! satisfies TrustedType
  - (JSON.parse(x)) satisfies Record<string, unknown>
  - JSON.parse(x) as unknown as TrustedType
  - JSON.parse(x) as unknown as unknown as TrustedType
  - (JSON.parse(x) as unknown) as Record<string, unknown>
  - "<TrustedType><unknown>JSON.parse(x)"
  - JSON.parse(JSON.stringify(value)) as StructuredValue
---
id: json-parse-variable-bindings-keep-unknown
valid:
  - "const value: unknown = JSON.parse(source)"
  - "let value: unknown = JSON.parse(source)"
invalid:
  - const value = JSON.parse(source)
  - const value = JSON.parse(source); const trusted = value as TrustedType
  - "const value: TrustedType = JSON.parse(source)"
  - trusted = JSON.parse(source)
---
id: process-test-helpers-belong-to-process-boundaries
valid:
  - runByInProcessEffect(root, ["task", "list"])
invalid:
  - runBuiltByWithEnv(root, {}, "task", "list")
  - runBuiltByWithInput(root, "input", {}, "task", "list")
  - runByWithEnv(root, {}, "task", "list")
  - runBy(root, "init", "--task-prefix", "BY")
  - runJustBy("task", "list")
  - builtByExecutable()
---
id: test-child-processes-use-test-process-adapter
valid:
  - import { runTestProcess } from "./testProcess.js"
invalid:
  - export { spawn } from "node:child_process"
  - export * as childProcess from "child_process/promises"
---
id: package-installation-belongs-to-package-contract
valid:
  - spawnSync("git", ["status"])
  - runTestProcess("pnpm", ["view", "but-why"], { cwd })
  - describe("npm", () => {})
  - join("npm", "package.json")
invalid:
  - spawnSync("npm", ["pack"])
  - execFileSync("npm", ["pack"])
  - childProcess.spawnSync("npm", ["pack"])
  - childProcess.execFileSync("npm", ["pack"])
  - runTestProcess("npm", ["view", "but-why"], { cwd })
  - "runTestProcess((/* executable */ \"npm\"), [\"view\", \"but-why\"], { cwd })"
  - runTestProcess("npm", ["pack", "--json"], { cwd })
  - runTestProcess('npm', ['install', '--ignore-scripts'], { cwd })
  - runTestProcess("npm", ["i", "package"], { cwd })
  - runTestProcess("npm", ["install-ci-test"], { cwd })
  - runTestProcess("npm", ["it"], { cwd })
  - runTestProcessOrThrow("npm", (["pack"]), { cwd })
  - "runTestProcess(\"npm\", [/* command */ \"install\"], { cwd })"
  - "runTestProcess(\"npm\", [((((\"install\"))))], { cwd })"
  - runTestProcess("npm", ["install"] as const, { cwd })
  - startTestProcess("npm", ["install"], { cwd })
  - testProcess.runTestProcess("npm", ["install"], { cwd })
  - "runTestProcess(`npm`, [`install`], { cwd })"
  - (runTestProcess)("npm", ["install"], { cwd })
  - runTestProcess!("npm", ["install"], { cwd })
  - runTestProcess?.("npm", ["install"], { cwd })
  - runTestProcess.call(undefined, "npm", ["install"], { cwd })
  - runTestProcess.apply(undefined, ["npm", ["install"], { cwd }])
  - runTestProcess.bind(undefined, "npm")(["install"], { cwd })
  - runTestProcess["call"](undefined, "npm", ["install"], { cwd })
  - Reflect.apply(runTestProcess, undefined, ["npm", ["install"], { cwd }])
---
id: test-process-helper-imports-keep-canonical-names
valid:
  - import { runTestProcess } from "./support/testProcess.js"
  - import { runTestProcess as execute } from "./other.js"
  - export { runTestProcess as execute } from "./other.js"
invalid:
  - import { runTestProcess as execute } from "./support/testProcess.js"
  - import { helper, startTestProcess as start } from "../support/testProcess.js"
  - import { runTestProcess /* equivalent alias */ as execute } from "./support/testProcess.js"
  - import { "runTestProcess" as execute } from "./support/testProcess.js"
  - export { runTestProcess } from "./support/testProcess.js"
  - export { runTestProcess as execute } from "./support/testProcess.js"
  - const execute = runTestProcess
  - let execute = runTestProcessOrThrow
  - execute = startTestProcess
  - const execute = runTestProcess.bind(undefined)
  - "const execute: typeof runTestProcess = (...args) => runTestProcess(...args)"
---
id: live-agent-helper-belongs-to-test-host
valid:
  - openInteractiveSessionHost(adapter)
invalid:
  - openHerdrInteractiveSessionHost(undefined)
---
id: repository-sql-layer-belongs-to-repository-runtime
valid:
  - runtime.provide(program)
invalid:
  - repositorySqlLayer(config)
  - import { repositorySqlLayer } from "../sqlite/repositorySql.js";
