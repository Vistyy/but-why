id: process-properties-belong-to-cli-entry
valid:
  - environment.cwd
  - processState.env
invalid:
  - process.env
  - process.stdout.write(output)
  - process.exitCode = 1
  - globalThis.process.env
---
id: effect-tests-use-effect-vitest-runtime
valid:
  - it.effect("executes work", () => Effect.map(work, done))
  - it.scoped("executes scoped work", () => work)
invalid:
  - Effect.runPromise(work)
  - Fx.runPromiseExit(work)
  - Effect.runSync(work)
  - runtime.runSyncExit(work)
  - Effect.runFork(work)
  - Fx.runCallback(work)
---
id: task-identity-branding-belongs-to-task-id
valid:
  - storedPublicTaskId(value)
  - value satisfies PublicTaskId
invalid:
  - value as PublicTaskId
  - value as TaskSlug
---
id: wall-clock-belongs-to-cli-entry
valid:
  - new Date(value)
  - clock.now()
invalid:
  - new Date()
  - Date.now()
  - new globalThis.Date()
  - globalThis.Date.now()
  - Date["now"]()
  - globalThis.Date["now"]()
---
id: json-parse-assertions-keep-unknown
# The serialization transform is prohibited outside the ignored file; the sole
# file-scoped exception is src/output/structuredValue.ts because its immediately
# preceding JSON serialization establishes exactly the StructuredValue representation.
valid:
  - JSON.parse(x) as unknown
  - "<unknown>JSON.parse(x)"
  - (JSON.parse(x)) as unknown
  - "<unknown>(JSON.parse(x))"
  - "const value: unknown = JSON.parse(source);"
  - decode(value, path)
invalid:
  - JSON.parse(x) as TrustedType
  - "<TrustedType>JSON.parse(x)"
  - (JSON.parse(x)) as TrustedType
  - "<TrustedType>(JSON.parse(x))"
  - JSON.parse((x)) as TrustedType
  - "<TrustedType>(JSON.parse((x)))"
  - JSON.parse(x) as Record<string, unknown>
  - "JSON.parse(x) as { readonly id: string }"
  - JSON.parse(x) as DomainType[]
  - JSON.parse(x) as unknown[]
  - JSON.parse(x) as any
  - "<any>JSON.parse(x)"
  - JSON.parse(JSON.stringify(value)) as StructuredValue
---
id: json-parse-results-start-unknown
valid:
  - const value = JSON.parse(source) as unknown
  - const value = <unknown>JSON.parse(source)
invalid:
  - const value = JSON.parse(source)
  - "const value: unknown = JSON.parse(source)"
  - trusted = JSON.parse(source)
  - "const parseUnknown = (): unknown => JSON.parse(source)"
  - acceptUnknown(JSON.parse(source))
  - JSON.parse(source).known as unknown
  - acceptUnknown(JSON.parse(source)) as unknown
  - (JSON.parse(source).known) as unknown
  - (acceptUnknown(JSON.parse(source))) as unknown
---
id: process-test-helpers-belong-to-process-boundaries
valid:
  - runByInProcessEffect(root, ["task", "list"])
invalid:
  - runBuiltByWithEnv(root, {}, "task", "list")
  - runBuiltByWithInput(root, "input", {}, "task", "list")
  - runByWithEnv(root, {}, "task", "list")
  - runBy(root, "init", "--id-prefix", "BY")
  - runJustBy("task", "list")
  - builtByExecutable()
---
id: test-child-processes-use-test-process-adapter
valid:
  - export { runTestProcess } from "./testProcess.js"
invalid:
  - export { spawn } from "node:child_process"
  - export * as childProcess from "child_process/promises"
---
id: package-installation-belongs-to-package-contract
valid:
  - spawnSync("git", ["status"])
  - runTestProcess("npm", ["view", "but-why"])
invalid:
  - spawnSync("npm", ["pack"])
  - execFileSync("npm", ["pack"])
  - runTestProcess("npm", ["pack", "--json"], { cwd })
  - runTestProcess('npm', ['install', '--ignore-scripts'], { cwd })
---
id: live-agent-helper-belongs-to-test-host
valid:
  - openInteractiveSessionHost(adapter)
invalid:
  - openHerdrInteractiveSessionHost(undefined)
---
id: repository-sql-layer-belongs-to-repository-runtime
valid:
  - runtime.provide(program)
invalid:
  - repositorySqlLayer(config)
  - import { repositorySqlLayer } from "../repositoryRuntime/adapters/sqlite/repositorySql.js";
---
id: task-context-command-stays-in-task-intent
valid:
  - import { success } from "../../../cliResults.js";
  - import { TaskUseCases } from "../../../task/taskUseCases.js";
invalid:
  - import { loadTaskContextInspection } from "../../../taskChange/composition/loadTaskContextInspection.js";
  - import { queryTaskChangeProjection } from "../../../taskChange/inspectTaskChange.js";
  - import { inspectChange } from "../../../change/inspectChange.js";
---
id: linked-task-mutations-use-coordination
valid:
  - environment.taskChangeTaskUseCases.editTaskDependencies
  - environment.taskChangeTaskUseCases.reviseTask
invalid:
  - environment.taskUseCases.editTaskDependencies
  - environment.taskUseCases.reviseTask
---
id: nested-unknown-assertions-preserve-evidence
valid:
  - value as Target
  - JSON.parse(raw).foo as unknown as Target
  - Reflect.get(value, "foo") as unknown as Target
  - vi.mock("module", () => value as unknown as Target)
invalid:
  - value as unknown as Target
  - invalidPolicy as unknown as ChangePolicy
  - "const api = { sendUserMessage() {} } as unknown as ExtensionAPI"
  - "const context = { sessionManager: {}, isIdle() {} } as unknown as ExtensionContext"
  - value as unknown as ExtensionAPI
  - "(value as unknown) as Target"
---
id: nested-unknown-assertions-review-fixture
valid:
  - "for (const invalidPolicyFixtureForPersistenceRejection of invalidPolicies) { const value = invalidPolicyFixtureForPersistenceRejection as unknown as ChangePolicy; }"
  - vi.mock("module", () => value as unknown as Target)
invalid:
  - value as unknown as Target
---
id: nested-unknown-assertions-extension-fixture
valid:
  - "const createHarness = () => { const api = { __butWhyTypeEvidenceFixture: \"extension-api\", sendUserMessage() {} } as unknown as ExtensionAPI; }"
  - "const createHarness = () => { const context = { __butWhyTypeEvidenceFixture: \"extension-context\", sessionManager: {}, isIdle() {} } as unknown as ExtensionContext; }"
invalid:
  - value as unknown as Target
---
id: never-assertions-represent-real-union
valid:
  - value as unknown
  - value as never[]
  - assertNever(value)
  - JSON.parse(raw).foo as never
  - Reflect.get(value, "foo") as never
  - vi.mock("module", () => value as never)
invalid:
  - value as never
  - "(value) as never"
---
id: effect-values-use-complete-contract
valid:
  - value as EffectResult
  - value satisfies Effect.Effect<string>
  - JSON.parse(raw).foo as Effect.Effect<string>
  - Reflect.get(value, "foo") as Effect.Effect<string>
  - vi.mock("module", () => value as Effect.Effect<string>)
invalid:
  - value as Effect.Effect<string>
  - value as Effect.Effect<string, Error, Services>
  - "<Effect.Effect<string>>value"
---
id: return-or-pass-through-satisfies-uses-owner-contract
valid:
  - const result = value satisfies Result
  - "return value"
  - "value => value"
  - "value => other satisfies Result"
  - "return JSON.parse(raw).foo satisfies Result"
  - "return Reflect.get(value, \"foo\") satisfies Result"
  - "return function (value) { value satisfies Result; }"
  - "const a = (value: string) => { const result = value satisfies Result; return result; }"
  - "const k = (value: string) => { return wrap(value satisfies Result); }"
  - "const l = (value: string) => { return [value satisfies Result]; }"
  - "return await (value satisfies Result)"
  - "return (await (value satisfies Result))"
  - "return ((((await (value satisfies Result)))))"
  - "return function* (value) { value satisfies Result; }"
  - "function* f() { return yield (value satisfies Result); }"
  - "function* g() { return yield* (value satisfies Result); }"
  - "return function (value) { const result = value satisfies Result; return result; }"
  - "vi.mock(\"module\", (value) => value satisfies Result)"
invalid:
  - "return value satisfies Result"
  - "return await value satisfies Result"
  - "return (value satisfies Result)"
  - "return (await value satisfies Result)"
  - "return ((await value satisfies Result))"
  - "return (((((await value satisfies Result)))))"
  - "return ((((await value) satisfies Result)))"
  - "return (((((await value) satisfies Result))))"
  - "return (((value satisfies Result)))"
  - "return (await value) satisfies Result"
  - "value => value satisfies Result"
  - "some(value => value satisfies Result)"
  - "items.map((value) => value satisfies Result)"
  - "const x = wrap(value => ((value satisfies Result)))"
  - "const x = { handler: value => value satisfies Result }"
  - "const x = [value => value satisfies Result]"
  - "value => ((value satisfies Result))"
  - "value => (((value satisfies Result)))"
  - "async value => value satisfies Result"
  - "(value) => value satisfies Result"
  - "(value) => (((value satisfies Result)))"
  - "async (value) => value satisfies Result"
  - "(value: string) => (value satisfies Result)"
  - "async (value: string): Promise<Result> => value satisfies Result"
  - "<T>(value: T) => value satisfies Result"
  - "async <T>(value: T) => value satisfies Result"
  - "<T>(value: T): Result => value satisfies Result"
  - "<T>(value): Result => ((value satisfies Result))"
  - "async <T>(value: T): Promise<Result> => value satisfies Result"
  - "async (value): Promise<Result> => ((value satisfies Result))"
  - "(value): Result => value satisfies Result"
  - "return function (value) { return value satisfies Result; }"
  - "return (function (value) {}) satisfies Result"
  - "return (function* (value) {}) satisfies Result"
  - "return (async function (value) {}) satisfies Result"
  - "const create = () => { return (function (value) {}) satisfies Result; }"
  - "const createGenerator = () => { return (function* (value) {}) satisfies Result; }"
