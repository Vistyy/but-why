id: process-properties-belong-to-cli-entry
valid:
  - environment.cwd
  - processState.env
invalid:
  - process.env
  - process.stdout.write(output)
  - process.exitCode = 1
  - globalThis.process.env
---
id: effect-tests-use-effect-vitest-runtime
valid:
  - it.effect("executes work", () => Effect.map(work, done))
  - it.scoped("executes scoped work", () => work)
invalid:
  - Effect.runPromise(work)
  - Fx.runPromiseExit(work)
  - Effect.runSync(work)
  - runtime.runSyncExit(work)
  - Effect.runFork(work)
  - Fx.runCallback(work)
---
id: toon-package-belongs-to-output-codec
valid:
  - import { success } from "../cliResults.js";
invalid:
  - import { encode as toonEncode } from "@toon-format/toon";
  - import * as Toon from "@toon-format/toon";
  - import("@toon-format/toon")
  - require("@toon-format/toon")
---
id: sandcastle-factories-belong-to-workspace
valid:
  - import type { Sandbox } from "@ai-hero/sandcastle";
  - import { pi, type Sandbox } from "@ai-hero/sandcastle";
  - createValidationWorkspace(input)
invalid:
  - import { createSandbox as makeSandbox } from "@ai-hero/sandcastle";
  - import { noSandbox as none } from "@ai-hero/sandcastle/sandboxes/no-sandbox";
  - import * as Sandcastle from "@ai-hero/sandcastle";
  - import Sandcastle from "@ai-hero/sandcastle";
  - import("@ai-hero/sandcastle")
  - require("@ai-hero/sandcastle")
---
id: task-identity-branding-belongs-to-task-id
valid:
  - storedPublicTaskId(value)
  - value satisfies PublicTaskId
invalid:
  - value as PublicTaskId
  - value as TaskSlug
---
id: wall-clock-belongs-to-cli-entry
valid:
  - new Date(value)
  - clock.now()
invalid:
  - new Date()
  - Date.now()
  - new globalThis.Date()
  - globalThis.Date.now()
  - Date["now"]()
  - globalThis.Date["now"]()
---
id: json-parse-assertions-keep-unknown
# The reviewed exception: src/output/structuredValue.ts may assert
# JSON.parse(JSON.stringify(value)) as StructuredValue because its immediately
# preceding JSON serialization establishes exactly the StructuredValue
# representation; the rule's ignores list limits the exception to that file.
valid:
  - JSON.parse(x) as unknown
  - "<unknown>JSON.parse(x)"
  - (JSON.parse(x)) as unknown
  - "<unknown>(JSON.parse(x))"
  - "const value: unknown = JSON.parse(source);"
  - decode(value, path)
invalid:
  - JSON.parse(x) as TrustedType
  - "<TrustedType>JSON.parse(x)"
  - (JSON.parse(x)) as TrustedType
  - "<TrustedType>(JSON.parse(x))"
  - JSON.parse((x)) as TrustedType
  - "<TrustedType>(JSON.parse((x)))"
  - JSON.parse(x) as Record<string, unknown>
  - "JSON.parse(x) as { readonly id: string }"
  - JSON.parse(x) as DomainType[]
  - JSON.parse(x) as unknown[]
  - JSON.parse(x) as any
  - "<any>JSON.parse(x)"
---
id: process-test-helpers-belong-to-process-boundaries
valid:
  - runByInProcessEffect(root, ["task", "list"])
invalid:
  - runBuiltByWithEnv(root, {}, "task", "list")
  - runBuiltByWithInput(root, "input", {}, "task", "list")
  - runByWithEnv(root, {}, "task", "list")
  - runBy(root, "init", "--task-prefix", "BY")
  - runJustBy("task", "list")
  - builtByExecutable()
---
id: package-installation-belongs-to-package-contract
valid:
  - spawnSync("git", ["status"])
invalid:
  - spawnSync("npm", ["pack"])
  - execFileSync("npm", ["pack"])
---
id: live-agent-helper-belongs-to-test-host
valid:
  - openInteractiveSessionHost(adapter)
invalid:
  - openHerdrInteractiveSessionHost(undefined)
---
id: direct-sandcastle-helpers-belong-to-validation-workspace
valid:
  - createValidationWorkspace(input)
invalid:
  - import { createSandbox } from "@ai-hero/sandcastle";
  - import { noSandbox } from "@ai-hero/sandcastle/sandboxes/no-sandbox";
  - createSandbox(input)
  - noSandbox()
