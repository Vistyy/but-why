id: direct-reflect-get-is-validated
valid:
  - Reflect["get"](value, "field")
  - (Reflect.get)(value, "field")
  - const get = Reflect.get; get(value, "field")
  - Reflect[method](value, method)
  - Reflect.get
  - other.Reflect.get(value, "field")
invalid:
  - Reflect.get(value, "field")
  - const Reflect = localReflect; Reflect.get(value, "field")
