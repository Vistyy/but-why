id: direct-module-mocking-uses-effect-boundary
valid:
  - vi["mock"]("module")
  - (vi.mock)("module")
  - const mock = vi.mock; mock("module")
  - vi[method]("module")
  - vi.mock
  - other.vi.mock("module")
  - vitest.mock("module")
  - jest["mock"]("module")
invalid:
  - vi.mock("module")
  - vi.doMock("module")
  - vi.unstable_mockModule("module")
  - jest.mock("module")
  - jest.doMock("module")
  - jest.unstable_mockModule("module")
  - const vi = localVitest; vi.mock("module")
---
