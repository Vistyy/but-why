# Module mocking hides the Effect dependency boundary and its lifecycle.
id: direct-module-mocking-uses-effect-boundary
language: TypeScript
severity: error
message: Do not call vi.mock, vi.doMock, vi.unstable_mockModule, jest.mock, jest.doMock, or jest.unstable_mockModule directly because module mocking bypasses the dependency boundary; use Effect services, Layers, or injected Adapters instead.
files:
  - src/**/*.ts
  - test/**/*.ts
  - extensions/**/*.ts
  - scripts/**/*.ts
rule:
  any:
    - pattern: vi.mock($$$ARGS)
    - pattern: vi.doMock($$$ARGS)
    - pattern: vi.unstable_mockModule($$$ARGS)
    - pattern: jest.mock($$$ARGS)
    - pattern: jest.doMock($$$ARGS)
    - pattern: jest.unstable_mockModule($$$ARGS)
---
