id: process-properties-belong-to-cli-entry
language: TypeScript
severity: error
message: Do not read process properties outside src/main.ts because CLI environment ownership keeps process access at the entry point; receive CLI environment values through the owning interface.
files:
  - src/**/*.ts
ignores:
  - src/main.ts
rule:
  any:
    - pattern: process.$PROPERTY
    - pattern: globalThis.process.$PROPERTY
---
id: effect-tests-use-effect-vitest-runtime
language: TypeScript
severity: error
message: Do not call runtime-style Effect methods in tests because @effect/vitest must control Effect execution; use @effect/vitest APIs such as it.effect or it.scoped.
files:
  - test/**/*.ts
rule:
  any:
    - pattern: $RUNTIME.runPromise($$$ARGS)
    - pattern: $RUNTIME.runPromiseExit($$$ARGS)
    - pattern: $RUNTIME.runSync($$$ARGS)
    - pattern: $RUNTIME.runSyncExit($$$ARGS)
    - pattern: $RUNTIME.runFork($$$ARGS)
    - pattern: $RUNTIME.runCallback($$$ARGS)
---
id: toon-package-belongs-to-output-codec
language: TypeScript
severity: error
message: Do not load @toon-format/toon outside src/output/toon.ts because output ownership keeps format dependencies at the codec; return structured results and let the codec encode them.
files:
  - src/**/*.ts
ignores:
  - src/output/toon.ts
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '[\s\S]*["`]@toon-format/toon["`][\s\S]*'
    - pattern: import("@toon-format/toon")
    - pattern: require("@toon-format/toon")
---
id: sandcastle-factories-belong-to-workspace
language: TypeScript
severity: error
message: Do not load Sandcastle workspace factories outside src/disposableWorkspace/runDisposableExactCommitWorkspace.ts because the disposable workspace Adapter owns sandbox lifecycle; use runDisposableExactCommitWorkspace.
files:
  - src/**/*.ts
ignores:
  - src/disposableWorkspace/runDisposableExactCommitWorkspace.ts
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '[\s\S]*(createSandbox|noSandbox)[\s\S]*from\s+["`]@ai-hero/sandcastle([^"`]*)?["`][\s\S]*'
    - all:
        - kind: import_statement
        - regex: '[\s\S]*import\s+(\*\s+as\s+|[A-Za-z_$][A-Za-z0-9_$]*\s+from\s+)[\s\S]*["`]@ai-hero/sandcastle([^"`]*)?["`][\s\S]*'
    - all:
        - kind: call_expression
        - regex: '^(import|require)\(["`]@ai-hero/sandcastle([^"`]*)?["`]\)$'
---
id: task-identity-branding-belongs-to-task-id
language: TypeScript
severity: error
message: Do not cast values to PublicTaskId or TaskSlug outside src/task/taskId.ts because task identity invariants belong to the identity module; use publicTaskId, storedPublicTaskId, or taskSlugForId.
files:
  - src/**/*.ts
ignores:
  - src/task/taskId.ts
rule:
  any:
    - pattern: $VALUE as PublicTaskId
    - pattern: $VALUE as TaskSlug
---
id: wall-clock-belongs-to-cli-entry
language: TypeScript
severity: error
message: Do not read the wall clock outside src/main.ts because timestamp ownership keeps time nondeterminism at the CLI entry point; receive timestamps through the owning interface.
files:
  - src/**/*.ts
ignores:
  - src/main.ts
  - src/change/interactiveSession/herdrInteractiveSessionHost.ts
rule:
  any:
    - pattern: new Date()
    - pattern: Date.now()
    - pattern: new globalThis.Date()
    - pattern: globalThis.Date.now()
    - pattern: Date["now"]()
    - pattern: globalThis.Date["now"]()
---
# Parsed JSON keeps an unknown runtime shape until the owning boundary decodes it.
# src/output/structuredValue.ts is the sole file-scoped exception because its immediately preceding JSON serialization establishes exactly the StructuredValue representation; the serialization transform remains prohibited outside that ignored file.
id: json-parse-assertions-keep-unknown
language: TypeScript
severity: error
message: Do not assert JSON.parse output directly to a trusted type because parsed JSON has an unknown runtime shape until the owning boundary establishes it; parse into unknown and use the owning boundary's focused decoder or schema.
files:
  - src/**/*.ts
ignores:
  - src/output/structuredValue.ts
rule:
  all:
    - any:
        - pattern: JSON.parse($$$ARGS) as $TYPE
        - pattern: (JSON.parse($$$ARGS)) as $TYPE
        - pattern: <$TYPE>JSON.parse($$$ARGS)
        - pattern: <$TYPE>(JSON.parse($$$ARGS))
    - not:
        any:
          - pattern: JSON.parse($$$ARGS) as unknown
          - pattern: (JSON.parse($$$ARGS)) as unknown
          - pattern: <unknown>JSON.parse($$$ARGS)
          - pattern: <unknown>(JSON.parse($$$ARGS))
---
# Expensive process startup belongs only to tests that prove an operating-system boundary.
id: process-test-helpers-belong-to-process-boundaries
language: TypeScript
severity: error
message: Do not use built CLI or process test helpers outside approved process-boundary tests because process startup is expensive; use the in-process CLI seam unless process isolation is the behavior under test.
files:
  - test/**/*.ts
ignores:
  - test/support/by-cli.ts
  - test/support/initializedRepo.ts
  - test/repository/quality-interface.test.ts
  - test/task/task-cli-process.test.ts
  - test/change/change-implement-process.test.ts
  - test/change/change-implement-main-checkout-failure.test.ts
rule:
  any:
    - pattern: runBuiltByWithEnv($$$ARGS)
    - pattern: runBuiltByWithInput($$$ARGS)
    - pattern: runByWithEnv($$$ARGS)
    - pattern: runBy($$$ARGS)
    - pattern: runJustBy($$$ARGS)
    - pattern: builtByExecutable()
---
# Test process creation owns the one isolated subprocess Adapter.
id: test-child-processes-use-test-process-adapter
language: TypeScript
severity: error
message: Do not create test child processes directly because shared checkout state, user state, and temporary files can race; use the Adapter in test/support/testProcess.ts with an explicit cwd and controlled environment.
files:
  - test/**/*.ts
ignores:
  - test/support/testProcess.ts
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '[\\s\\S]*["`]node:child_process([^"`]*)?["`][\\s\\S]*'
    - all:
        - kind: import_statement
        - regex: '[\\s\\S]*["`]child_process([^"`]*)?["`][\\s\\S]*'
    - pattern: import("node:child_process")
    - pattern: import('node:child_process')
    - pattern: require("node:child_process")
    - pattern: require('node:child_process')
    - all:
        - kind: call_expression
        - regex: '^(import|require)\\(["`]node:child_process([^"`]*)?["`]\\)$'
    - pattern: import("node:child_process/promises")
    - pattern: import('node:child_process/promises')
    - pattern: require("node:child_process/promises")
    - pattern: require('node:child_process/promises')
    - all:
        - kind: call_expression
        - regex: '^(import|require)\\(["`]child_process([^"`]*)?["`]\\)$'
---
# Package inspection owns the one external package contract.
id: package-installation-belongs-to-package-contract
language: TypeScript
severity: error
message: Do not install or pack the package outside the package contract test because package setup is expensive; use source-level interfaces for behavior variations.
files:
  - test/**/*.ts
ignores:
  - test/repository/package-contents.test.ts
rule:
  any:
    - pattern: spawnSync("npm", $$$ARGS)
    - pattern: execFileSync("npm", $$$ARGS)
    - pattern: spawnSync('npm', $$$ARGS)
    - pattern: execFileSync('npm', $$$ARGS)
---
# The live Interactive Session contract owns the real Herdr helper.
id: live-agent-helper-belongs-to-test-host
language: TypeScript
severity: error
message: Do not use the live Herdr helper outside the Interactive Session host test because that host owns the live boundary; use the Interactive Session interface with a test Adapter.
files:
  - test/**/*.ts
ignores:
  - test/agent/herdr-interactive-session-host.test.ts
rule:
  any:
    - pattern: openHerdrInteractiveSessionHost($$$ARGS)
---
# Validation workspace composition owns direct Sandcastle factories.
id: direct-sandcastle-helpers-belong-to-validation-workspace
language: TypeScript
severity: error
message: Do not use Sandcastle factories in tests because validation workspace composition owns Sandcastle setup; use the Candidate Validation seam for behavior variations.
files:
  - test/**/*.ts
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '[\s\S]*(createSandbox|noSandbox)[\s\S]*from\s+["`]@ai-hero/sandcastle([^"`]*)?["`][\s\S]*'
    - pattern: createSandbox($$$ARGS)
    - pattern: noSandbox($$$ARGS)
