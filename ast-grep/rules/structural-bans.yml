# `never` assertions hide an unrepresented runtime case instead of proving it impossible.
id: never-assertions-represent-real-union
language: TypeScript
severity: error
message: Do not use `as never` because it hides an unrepresented runtime case; represent the real union or prove impossibility through exhaustive control flow.
files:
  - src/**/*.ts
  - test/**/*.ts
  - extensions/**/*.ts
  - scripts/**/*.ts
ignores:
  - src/sqlite/**/*.ts
  - '**/adapters/sqlite/**/*.ts'
rule:
  all:
    - pattern: $VALUE as never
    - not:
        pattern: JSON.parse($$$ARGS) as never
    - not:
        pattern: (JSON.parse($$$ARGS)) as never
    - not:
        pattern: JSON.parse($$$ARGS).$PROPERTY as never
    - not:
        pattern: JSON.parse($$$ARGS)[$PROPERTY] as never
    - not:
        pattern: Reflect.get($$$ARGS) as never
    - not:
        pattern: Reflect.apply($$$ARGS) as never
    - not:
        inside:
          any:
            - pattern: vi.mock($$$ARGS)
            - pattern: vi.doMock($$$ARGS)
            - pattern: vi.unstable_mockModule($$$ARGS)
            - pattern: jest.mock($$$ARGS)
            - pattern: jest.doMock($$$ARGS)
            - pattern: jest.unstable_mockModule($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: JSON.parse($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: Reflect.$METHOD($$$ARGS)
          stopBy: end
---
# A complete Effect assertion hides the contract that the Effect value already owns.
id: effect-values-use-complete-contract
language: TypeScript
severity: error
message: Do not assert a complete value to `Effect.Effect<...>` because it hides the value's contract; export or use the complete Effect contract instead of asserting the whole value.
files:
  - src/**/*.ts
  - test/**/*.ts
  - extensions/**/*.ts
  - scripts/**/*.ts
ignores:
  - src/sqlite/**/*.ts
  - '**/adapters/sqlite/**/*.ts'
rule:
  all:
    - any:
        - pattern: $VALUE as Effect.Effect<$$$TYPE>
        - pattern: <Effect.Effect<$$$TYPE>>$VALUE
    - not:
        pattern: JSON.parse($$$ARGS) as Effect.Effect<$$$TYPE>
    - not:
        pattern: <Effect.Effect<$$$TYPE>>JSON.parse($$$ARGS)
    - not:
        pattern: JSON.parse($$$ARGS).$PROPERTY as Effect.Effect<$$$TYPE>
    - not:
        pattern: JSON.parse($$$ARGS)[$PROPERTY] as Effect.Effect<$$$TYPE>
    - not:
        pattern: Reflect.get($$$ARGS) as Effect.Effect<$$$TYPE>
    - not:
        pattern: Reflect.apply($$$ARGS) as Effect.Effect<$$$TYPE>
    - not:
        inside:
          any:
            - pattern: vi.mock($$$ARGS)
            - pattern: vi.doMock($$$ARGS)
            - pattern: vi.unstable_mockModule($$$ARGS)
            - pattern: jest.mock($$$ARGS)
            - pattern: jest.doMock($$$ARGS)
            - pattern: jest.unstable_mockModule($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: JSON.parse($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: Reflect.$METHOD($$$ARGS)
          stopBy: end
---
# `satisfies` should constrain a construction or an explicit owner contract, not a returned or pass-through value.
id: return-or-pass-through-satisfies-uses-owner-contract
language: TypeScript
severity: error
message: Do not put `satisfies` directly on a returned or pass-through value because it hides the construction's evidence; put it on a construction before returning it or use an explicit owner contract.
files:
  - src/**/*.ts
  - test/**/*.ts
  - extensions/**/*.ts
  - scripts/**/*.ts
ignores:
  - src/sqlite/**/*.ts
  - '**/adapters/sqlite/**/*.ts'
rule:
  all:
    - any:
        - pattern: return $VALUE satisfies $TYPE
        - pattern: return await $VALUE satisfies $TYPE
        - pattern: return ($VALUE satisfies $TYPE)
        - pattern: return (await $VALUE) satisfies $TYPE
        - pattern: $VALUE => $VALUE satisfies $TYPE
        - pattern: $VALUE => ($VALUE satisfies $TYPE)
        - pattern: ($VALUE) => $VALUE satisfies $TYPE
        - pattern: ($VALUE) => ($VALUE satisfies $TYPE)
        - pattern: "($VALUE: $PARAMTYPE) => $VALUE satisfies $TYPE"
        - pattern: "($VALUE: $PARAMTYPE) => ($VALUE satisfies $TYPE)"
        - pattern: "($VALUE): $RETURNTYPE => $VALUE satisfies $TYPE"
        - pattern: "($VALUE): $RETURNTYPE => ($VALUE satisfies $TYPE)"
        - pattern: "($VALUE: $PARAMTYPE): $RETURNTYPE => $VALUE satisfies $TYPE"
        - pattern: "($VALUE: $PARAMTYPE): $RETURNTYPE => ($VALUE satisfies $TYPE)"
    - not:
        pattern: return JSON.parse($$$ARGS) satisfies $TYPE
    - not:
        pattern: return (JSON.parse($$$ARGS) satisfies $TYPE)
    - not:
        pattern: JSON.parse($$$ARGS) satisfies $TYPE
    - not:
        has:
          pattern: JSON.parse($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: Reflect.get($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: Reflect.apply($$$ARGS)
          stopBy: end
    - not:
        pattern: return await JSON.parse($$$ARGS) satisfies $TYPE
    - not:
        pattern: return (await JSON.parse($$$ARGS)) satisfies $TYPE
    - not:
        pattern: return JSON.parse($$$ARGS).$PROPERTY satisfies $TYPE
    - not:
        pattern: return JSON.parse($$$ARGS)[$PROPERTY] satisfies $TYPE
    - not:
        pattern: JSON.parse($$$ARGS).$PROPERTY satisfies $TYPE
    - not:
        pattern: JSON.parse($$$ARGS)[$PROPERTY] satisfies $TYPE
    - not:
        pattern: Reflect.get($$$ARGS) satisfies $TYPE
    - not:
        pattern: Reflect.apply($$$ARGS) satisfies $TYPE
    - not:
        has:
          pattern: Reflect.$METHOD($$$ARGS)
          stopBy: end
    - not:
        inside:
          any:
            - pattern: vi.mock($$$ARGS)
            - pattern: vi.doMock($$$ARGS)
            - pattern: vi.unstable_mockModule($$$ARGS)
            - pattern: jest.mock($$$ARGS)
            - pattern: jest.doMock($$$ARGS)
            - pattern: jest.unstable_mockModule($$$ARGS)
          stopBy: end
