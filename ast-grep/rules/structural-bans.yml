id: process-properties-belong-to-cli-entry
language: TypeScript
severity: error
message: Do not read process properties outside src/main.ts because CLI environment ownership keeps process access at the entry point; receive CLI environment values through the owning interface.
files:
  - src/**/*.ts
ignores:
  - src/main.ts
rule:
  any:
    - pattern: process.$PROPERTY
    - pattern: globalThis.process.$PROPERTY
---
id: effect-tests-use-effect-vitest-runtime
language: TypeScript
severity: error
message: Do not call runtime-style Effect methods in tests because @effect/vitest must control Effect execution; use @effect/vitest APIs such as it.effect or it.scoped.
files:
  - test/**/*.ts
rule:
  any:
    - pattern: $RUNTIME.runPromise($$$ARGS)
    - pattern: $RUNTIME.runPromiseExit($$$ARGS)
    - pattern: $RUNTIME.runSync($$$ARGS)
    - pattern: $RUNTIME.runSyncExit($$$ARGS)
    - pattern: $RUNTIME.runFork($$$ARGS)
    - pattern: $RUNTIME.runCallback($$$ARGS)
---
id: task-identity-branding-belongs-to-task-id
language: TypeScript
severity: error
message: Do not cast values to PublicTaskId or TaskSlug outside src/task/taskId.ts because task identity invariants belong to the identity module; use publicTaskId, storedPublicTaskId, or taskSlugForId.
files:
  - src/**/*.ts
ignores:
  - src/task/taskId.ts
rule:
  any:
    - pattern: $VALUE as PublicTaskId
    - pattern: $VALUE as TaskSlug
---
id: wall-clock-belongs-to-cli-entry
language: TypeScript
severity: error
message: Do not read the wall clock outside src/main.ts because timestamp ownership keeps time nondeterminism at the CLI entry point; receive timestamps through the owning interface.
files:
  - src/**/*.ts
ignores:
  - src/main.ts
  - src/change/interactiveSession/adapters/herdrInteractiveSessionHost.ts
rule:
  any:
    - pattern: new Date()
    - pattern: Date.now()
    - pattern: new globalThis.Date()
    - pattern: globalThis.Date.now()
    - pattern: Date["now"]()
    - pattern: globalThis.Date["now"]()
---
# Parsed JSON keeps an unknown runtime shape until the owning boundary decodes it.
# src/output/structuredValue.ts is the sole file-scoped exception because its immediately preceding JSON serialization establishes exactly the StructuredValue representation; the serialization transform remains prohibited outside that ignored file.
id: json-parse-assertions-keep-unknown
language: TypeScript
severity: error
message: Do not assert JSON.parse output directly to a trusted type because parsed JSON has an unknown runtime shape until the owning boundary establishes it; parse into unknown and use the owning boundary's focused decoder or schema.
files:
  - extensions/**/*.ts
  - scripts/**/*.ts
  - src/**/*.ts
ignores:
  - src/output/structuredValue.ts
rule:
  all:
    - any:
        - pattern: JSON.parse($$$ARGS) as $TYPE
        - pattern: (JSON.parse($$$ARGS)) as $TYPE
        - pattern: <$TYPE>JSON.parse($$$ARGS)
        - pattern: <$TYPE>(JSON.parse($$$ARGS))
    - not:
        any:
          - pattern: JSON.parse($$$ARGS) as unknown
          - pattern: (JSON.parse($$$ARGS)) as unknown
          - pattern: <unknown>JSON.parse($$$ARGS)
          - pattern: <unknown>(JSON.parse($$$ARGS))
---
# The explicit unknown assertion makes the runtime boundary visible at the parse expression.
id: json-parse-results-start-unknown
language: TypeScript
severity: error
message: Do not use JSON.parse output before asserting it as unknown because parsed JSON has an unknown runtime shape; write JSON.parse(source) as unknown and use the owning boundary's focused decoder or schema.
files:
  - extensions/**/*.ts
  - scripts/**/*.ts
  - src/**/*.ts
ignores:
  # This serialization transform establishes exactly the StructuredValue representation.
  - src/output/structuredValue.ts
rule:
  all:
    - pattern: JSON.parse($$$ARGS)
    - not:
        any:
          - inside:
              any:
                - pattern: $VALUE as unknown
                - pattern: <unknown>$VALUE
              stopBy: neighbor
          - inside:
              all:
                - kind: parenthesized_expression
                - inside:
                    any:
                      - pattern: $VALUE as unknown
                      - pattern: <unknown>$VALUE
                    stopBy: neighbor
              stopBy: neighbor
---
# Expensive process startup belongs only to tests that prove an operating-system boundary.
id: process-test-helpers-belong-to-process-boundaries
language: TypeScript
severity: error
message: Do not use built CLI or process test helpers outside approved process-boundary tests because process startup is expensive; use the in-process CLI seam unless process isolation is the behavior under test.
files:
  - test/**/*.ts
ignores:
  - test/support/by-cli.ts
  - test/support/initializedRepo.ts
  - test/repository/quality-interface.test.ts
  - test/task/task-cli-process.test.ts
  - test/change/change-implement-process.test.ts
rule:
  any:
    - pattern: runBuiltByWithEnv($$$ARGS)
    - pattern: runBuiltByWithInput($$$ARGS)
    - pattern: runByWithEnv($$$ARGS)
    - pattern: runBy($$$ARGS)
    - pattern: runJustBy($$$ARGS)
    - pattern: builtByExecutable()
---
# Test process creation owns the one isolated subprocess Adapter.
id: test-child-processes-use-test-process-adapter
language: TypeScript
severity: error
message: Do not create test child processes directly because shared checkout state, user state, and temporary files can race; use the Adapter in test/support/testProcess.ts with an explicit cwd and controlled environment.
files:
  - test/**/*.ts
ignores:
  - test/support/testProcess.ts
rule:
  any:
    - all:
        - kind: import_statement
        - regex: '[\\s\\S]*["`]node:child_process([^"`]*)?["`][\\s\\S]*'
    - all:
        - kind: import_statement
        - regex: '[\\s\\S]*["`]child_process([^"`]*)?["`][\\s\\S]*'
    - all:
        - kind: export_statement
        - regex: '[\\s\\S]*["`]node:child_process([^"`]*)?["`][\\s\\S]*'
    - all:
        - kind: export_statement
        - regex: '[\\s\\S]*["`]child_process([^"`]*)?["`][\\s\\S]*'
    - pattern: import("node:child_process")
    - pattern: import('node:child_process')
    - pattern: require("node:child_process")
    - pattern: require('node:child_process')
    - all:
        - kind: call_expression
        - regex: '^(import|require)\\(["`]node:child_process([^"`]*)?["`]\\)$'
    - pattern: import("node:child_process/promises")
    - pattern: import('node:child_process/promises')
    - pattern: require("node:child_process/promises")
    - pattern: require('node:child_process/promises')
    - all:
        - kind: call_expression
        - regex: '^(import|require)\\(["`]child_process([^"`]*)?["`]\\)$'
---
# Package inspection owns the one external package contract.
id: package-installation-belongs-to-package-contract
language: TypeScript
severity: error
message: Do not install or pack the package outside the package contract test because package setup is expensive; use source-level interfaces for behavior variations.
files:
  - test/**/*.ts
ignores:
  - test/repository/package-contents.test.ts
rule:
  any:
    - pattern: spawnSync("npm", $$$ARGS)
    - pattern: execFileSync("npm", $$$ARGS)
    - pattern: spawnSync('npm', $$$ARGS)
    - pattern: execFileSync('npm', $$$ARGS)
    - pattern: runTestProcess("npm", ["pack"], $$$OPTIONS)
    - pattern: runTestProcess('npm', ['pack'], $$$OPTIONS)
    - pattern: runTestProcess("npm", ["pack", $$$ARGS], $$$OPTIONS)
    - pattern: runTestProcess('npm', ['pack', $$$ARGS], $$$OPTIONS)
    - pattern: runTestProcess("npm", ["install"], $$$OPTIONS)
    - pattern: runTestProcess('npm', ['install'], $$$OPTIONS)
    - pattern: runTestProcess("npm", ["install", $$$ARGS], $$$OPTIONS)
    - pattern: runTestProcess('npm', ['install', $$$ARGS], $$$OPTIONS)
---
# The live Interactive Session contract owns the real Herdr helper.
id: live-agent-helper-belongs-to-test-host
language: TypeScript
severity: error
message: Do not use the live Herdr helper outside the Interactive Session host test because that host owns the live boundary; use the Interactive Session interface with a test Adapter.
files:
  - test/**/*.ts
ignores:
  - test/agent/herdr-interactive-session-host.test.ts
rule:
  any:
    - pattern: openHerdrInteractiveSessionHost($$$ARGS)
---
# Repository Runtime is the only production owner of the Shared Repository State database lifecycle.
id: repository-sql-layer-belongs-to-repository-runtime
language: TypeScript
severity: error
message: Do not construct the Shared Repository State SQL layer outside Repository Runtime because Repository Runtime owns state existence, migration, and connection lifecycle; use a Repository Runtime capability in behavior composition.
files:
  - src/**/*.ts
ignores:
  - src/repositoryRuntime/repositoryContext.ts
  - src/repositoryRuntime/repositoryRuntime.ts
  - src/repositoryRuntime/adapters/sqlite/repositorySql.ts
rule:
  any:
    - pattern: repositorySqlLayer($$$ARGS)
    - all:
        - kind: import_statement
        - regex: '[\s\S]*repositorySqlLayer[\s\S]*from\s+["`][^"`]+["`][\s\S]*'
---
# Task Intent owns current Task Context; the Task Context command must not depend on Change or Task/Change coordination inspection.
id: task-context-command-stays-in-task-intent
language: TypeScript
severity: error
message: Do not import Change or Task/Change coordination modules from the Task Context command because Task Intent owns current Task Context; use Task Use Cases directly.
files:
  - src/cli/task/commands/context.ts
rule:
  all:
    - kind: import_statement
    - regex: '[\s\S]*from\s+["`][^"`]*(?:/change/|/taskChange/)[^"`]*["`][\s\S]*'
---
# Task dependency edits and revision must not obtain coordination operations from the generic Task use-case set.
id: linked-task-mutations-use-coordination
language: TypeScript
severity: error
message: Do not route linked Task dependency edits or Task revision through generic TaskUseCases; use the explicit Task/Change coordination use-case seam.
files:
  - src/cli/task/taskCliSupport.ts
rule:
  any:
    - pattern: environment.taskUseCases.editTaskDependencies
    - pattern: environment.taskUseCases.reviseTask
---
# Nested assertions erase the evidence needed to understand the unsupported conversion.
id: nested-unknown-assertions-preserve-evidence
language: TypeScript
severity: error
message: Do not chain `as unknown as` because nested assertions erase type evidence; preserve evidence with inference, a typed Adapter, or one justified assertion.
files:
  - src/**/*.ts
  - test/**/*.ts
  - extensions/**/*.ts
  - scripts/**/*.ts
ignores:
  - src/sqlite/**/*.ts
  - '**/adapters/sqlite/**/*.ts'
  - test/change/change-reviewer-configuration.test.ts
  - test/agent/continue-change-extension.test.ts
rule:
  all:
    - any:
        - pattern: $VALUE as unknown as $TYPE
        - pattern: ($VALUE as unknown) as $TYPE
    - not:
        pattern: JSON.parse($$$ARGS) as unknown as $TYPE
    - not:
        pattern: (JSON.parse($$$ARGS) as unknown) as $TYPE
    - not:
        pattern: JSON.parse($$$ARGS).$PROPERTY as unknown as $TYPE
    - not:
        pattern: JSON.parse($$$ARGS)[$PROPERTY] as unknown as $TYPE
    - not:
        pattern: Reflect.get($$$ARGS) as unknown as $TYPE
    - not:
        pattern: Reflect.apply($$$ARGS) as unknown as $TYPE
    - not:
        inside:
          any:
            - pattern: vi.mock($$$ARGS)
            - pattern: vi.doMock($$$ARGS)
            - pattern: vi.unstable_mockModule($$$ARGS)
            - pattern: jest.mock($$$ARGS)
            - pattern: jest.doMock($$$ARGS)
            - pattern: jest.unstable_mockModule($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: JSON.parse($$$ARGS)
          stopBy: end
    - not:
        has:
          pattern: Reflect.$METHOD($$$ARGS)
          stopBy: end
---
